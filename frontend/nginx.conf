server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  location /api/ { proxy_pass http://backend:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /uploads/ { proxy_pass http://backend:5000; }
  location /socket.io/ { proxy_pass http://backend:5000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri /index.html; }
}
