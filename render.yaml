# Render Blueprint: New + -> Blueprint -> pick your GitHub repo. Fill the 'sync: false' values when asked.
services:
  - type: web
    name: ticketdesk-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI          # your MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL         # the frontend URL, e.g. https://ticketdesk-web.onrender.com (no trailing slash)
        sync: false
      - key: PUBLIC_URL         # this API's own URL, e.g. https://ticketdesk-api.onrender.com
        sync: false
  - type: web
    name: ticketdesk-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # the API URL, e.g. https://ticketdesk-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
